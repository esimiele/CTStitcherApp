name: Release on Tag (Windows)

on:
  push:
    tags:
      - 'v*'   # e.g., v1.0.0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so the release notes generator can see history

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "CTStitcher/CTStitcherApp.sln"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (x64 Release)
        run: msbuild "CTStitcher/CTStitcherApp.sln" /p:Configuration=Release /p:Platform="x64" /m

      - name: Package for distribution (bin/CTStitcher)
        shell: pwsh
        run: |
          $binRoot = Join-Path $env:GITHUB_WORKSPACE "bin\CTStitcher"
          if (-not (Test-Path $binRoot)) {
            throw "Expected build output folder not found: $binRoot"
          }

          $exe = Get-ChildItem -Path $binRoot -Recurse -File -Include *.exe |
            Where-Object { $_.Name -notmatch 'vstest|testhost|vshost' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No application .exe found under $binRoot"
          }

          $zip = Join-Path $env:RUNNER_TEMP ("CTStitcherApp-" + "${{ github.ref_name }}".Replace('/','_') + ".zip")

          $paths = @("$($exe.DirectoryName)\*")
          $repoResources = Join-Path $env:GITHUB_WORKSPACE "Resources"
          if (Test-Path $repoResources) {
            $paths += "$repoResources\**\*"
          }

          Compress-Archive -Path $paths -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Packaged: $zip"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: ${{ env.ZIP }}