name: Release on Tag (Windows)

on:
  push:
    tags:
      - 'v*'   # e.g., v1.0.0

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so the release notes generator can see history

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "CTStitcher/CTStitcherApp.sln"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (x64 Release)
        run: msbuild "CTStitcher/CTStitcherApp.sln" /p:Configuration=Release /p:Platform="x64" /m

      - name: Package for distribution
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Include *.exe | Where-Object { $_.FullName -match '\\bin\\Release\\' } | Select-Object -First 1
          if (-not $exe) { throw "Could not find Release exe." }
          $root = Split-Path $exe.FullName -Parent
          $version = "${{ github.ref_name }}"  # the tag, e.g. v1.0.0
          $zip = "$env:RUNNER_TEMP\CTStitcherApp-$version.zip"
          $items = @("$root\*", "$root\..\*\*", ".\Resources\**\*")
          Compress-Archive -Path $items -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate release notes
        id: notes
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: ${{ env.ZIP }}